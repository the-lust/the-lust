<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 54" width="100%" height="54" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="3" fill="#cc2200" filter="url(#glow)"/>

  <!-- drip 1 -->
  <rect x="43" y="2" width="3" height="0" fill="#cc2200" rx="1">
    <animate attributeName="height" from="0" to="30" dur="1.9s" begin="0.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".4,0,.6,1"/>
  </rect>
  <ellipse cx="44.5" cy="35" rx="3.5" ry="4" fill="#cc2200" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="1.9s" fill="freeze"/>
  </ellipse>

  <!-- drip 2 -->
  <rect x="104" y="2" width="2" height="0" fill="#cc2200" rx="1">
    <animate attributeName="height" from="0" to="18" dur="1.6s" begin="0.45s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".4,0,.6,1"/>
  </rect>
  <ellipse cx="105" cy="23" rx="2.5" ry="3" fill="#cc2200" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="2.0s" fill="freeze"/>
  </ellipse>

  <!-- drip 3 -->
  <rect x="198" y="2" width="4" height="0" fill="#cc2200" rx="1">
    <animate attributeName="height" from="0" to="40" dur="2.1s" begin="0.15s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".4,0,.6,1"/>
  </rect>
  <ellipse cx="200" cy="46" rx="4.5" ry="5" fill="#cc2200" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="2.2s" fill="freeze"/>
  </ellipse>

  <!-- drip 4 -->
  <rect x="313" y="2" width="2" height="0" fill="#cc2200" rx="1">
    <animate attributeName="height" from="0" to="14" dur="1.5s" begin="0.62s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".4,0,.6,1"/>
  </rect>
  <ellipse cx="314" cy="19" rx="2.5" ry="3" fill="#cc2200" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="2.1s" fill="freeze"/>
  </ellipse>

  <!-- drip 5 (tallest, center) -->
  <rect x="447" y="2" width="5" height="0" fill="#cc2200" rx="1">
    <animate attributeName="height" from="0" to="46" dur="2.3s" begin="0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".4,0,.6,1"/>
  </rect>
  <ellipse cx="449.5" cy="52" rx="5" ry="6" fill="#cc2200" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="2.25s" fill="freeze"/>
  </ellipse>

  <!-- drip 6 -->
  <rect x="554" y="2" width="3" height="0" fill="#cc2200" rx="1">
    <animate attributeName="height" from="0" to="24" dur="1.8s" begin="0.38s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".4,0,.6,1"/>
  </rect>
  <ellipse cx="555.5" cy="29" rx="3.5" ry="4" fill="#cc2200" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="2.1s" fill="freeze"/>
  </ellipse>

  <!-- drip 7 -->
  <rect x="663" y="2" width="2" height="0" fill="#cc2200" rx="1">
    <animate attributeName="height" from="0" to="16" dur="1.6s" begin="0.55s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".4,0,.6,1"/>
  </rect>
  <ellipse cx="664" cy="21" rx="2.5" ry="3" fill="#cc2200" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="2.1s" fill="freeze"/>
  </ellipse>

  <!-- drip 8 -->
  <rect x="746" y="2" width="4" height="0" fill="#cc2200" rx="1">
    <animate attributeName="height" from="0" to="36" dur="2.0s" begin="0.18s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".4,0,.6,1"/>
  </rect>
  <ellipse cx="748" cy="42" rx="4" ry="5" fill="#cc2200" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="2.15s" fill="freeze"/>
  </ellipse>

  <!-- drip 9 -->
  <rect x="832" y="2" width="2" height="0" fill="#cc2200" rx="1">
    <animate attributeName="height" from="0" to="20" dur="1.7s" begin="0.48s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".4,0,.6,1"/>
  </rect>
  <ellipse cx="833" cy="25" rx="2.5" ry="3" fill="#cc2200" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="2.15s" fill="freeze"/>
  </ellipse>
</svg>
