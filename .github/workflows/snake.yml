name: Generate Snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff2200&color_dots[0]=%230d1117&color_dots[1]=%23330000&color_dots[2]=%23770000&color_dots[3]=%23bb0000&color_dots[4]=%23ff3300
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff2200&color_dots[0]=%230d1117&color_dots[1]=%23330000&color_dots[2]=%23770000&color_dots[3]=%23bb0000&color_dots[4]=%23ff3300

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
